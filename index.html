<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Casillas - Monopoly Rafal</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- HTML2Canvas para renderizar el HTML a imagen -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- jsPDF para generar el PDF de ambas caras -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="min-h-screen text-gray-800 flex flex-col">

    <header class="bg-red-600 text-white p-4 shadow-md z-10 relative">
        <div class="max-w-[1600px] mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold monopoly-font tracking-wider uppercase">Monopoly Rafal</h1>
            <p class="text-sm opacity-90 hidden sm:block">Generador de tarjetas para disfraces</p>
        </div>
    </header>

    <main class="flex-1 w-full max-w-[1600px] mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        
        <section class="lg:col-span-4 bg-white p-6 rounded-xl shadow-md border border-gray-200">
            <h2 class="text-xl font-bold mb-6 border-b pb-2">Diseña tu casilla</h2>
            
            <form id="card-form" class="space-y-5">
                <div>
                    <label for="site-selector" class="block text-sm font-semibold text-gray-700 mb-1">1. Elige tu Casilla</label>
                    <select id="site-selector" class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 transition-colors uppercase cursor-pointer">
                        <option value="">-- Selecciona una casilla --</option>
                    </select>
                    <p class="text-xs text-gray-500 mt-1">Nombre, color, precio y dorso se rellenan solos.</p>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">2. Imagen del Sitio</label>
                    <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-lg hover:bg-gray-50 transition-colors cursor-pointer relative" id="drop-zone">
                        <div class="space-y-1 text-center">
                            <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48" aria-hidden="true">
                                <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            <div class="flex text-sm text-gray-600 justify-center">
                                <label for="image-upload" class="relative cursor-pointer bg-white rounded-md font-medium text-red-600 hover:text-red-500 focus-within:outline-none">
                                    <span>Sube un archivo</span>
                                    <input id="image-upload" name="image-upload" type="file" class="sr-only" accept="image/*">
                                </label>
                                <p class="pl-1">o arrástralo aquí</p>
                            </div>
                            <p class="text-xs text-gray-500">PNG, JPG hasta 5MB</p>
                        </div>
                    </div>
                </div>

                <div class="pt-4">
                    <button type="button" id="download-btn" class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 font-bold text-lg transition-colors">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        Descargar PDF (Frente y Dorso)
                    </button>
                    <p class="text-xs text-gray-500 text-center mt-2">Guarda ambas caras en un documento PDF listo para imprimir.</p>
                </div>
            </form>
        </section>

        <section class="lg:col-span-8 flex flex-row flex-wrap items-center justify-center bg-gray-100 p-4 sm:p-8 rounded-xl border border-dashed border-gray-300 min-h-[600px] overflow-y-auto gap-8">
            
            <!-- CONTENEDOR FRONTAL -->
            <div id="monopoly-card" class="bg-[#fcfcfc] w-full max-w-[380px] aspect-[2.5/3.5] flex flex-col relative card-shadow select-none p-4 sm:p-5 shrink-0">
                <div class="border-[2px] border-black w-full h-full flex flex-col relative overflow-hidden">
                    
                    <div class="p-3 sm:p-4 pb-0 flex-shrink-0 w-full" id="card-header-wrapper">
                        <div id="card-color-header" class="w-full py-3 sm:py-4 border-[2px] border-black flex flex-col justify-center items-center px-2" style="background-color: #0072bb;">
                            <h2 id="card-title-preview" class="monopoly-font font-bold text-2xl sm:text-3xl text-center uppercase leading-tight text-white tracking-widest w-full">KEBAB PACO</h2>
                        </div>
                    </div>

                    <div class="w-full flex-1 min-h-0 relative flex items-center justify-center px-4 sm:px-5 py-4 sm:py-5">
                        <div class="w-full h-full relative z-0 flex items-center justify-center bg-[#fcfcfc]">
                            
                            <img id="card-image-preview" src="https://placehold.co/400x500/e5e7eb/a3a8b8?text=FOTO+AQUI" alt="Vista previa" class="absolute inset-0 w-full h-full object-cover z-0">
                            
                            <div id="no-image-text" class="absolute inset-0 flex flex-col items-center justify-center text-gray-400 hidden bg-gray-200 z-0">
                                <svg class="w-12 h-12 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                <span class="text-sm font-semibold">Sin imagen</span>
                            </div>

                            <div class="absolute inset-0 z-10 grid grid-cols-[24px_minmax(0,1fr)_24px] grid-rows-[24px_minmax(0,1fr)_24px] pointer-events-none">
                                <svg viewBox="0 0 24 24" class="w-full h-full text-black block"><path d="M 0,0 L 24,0 L 24,7 L 18,7 A 11,11 0 0,1 7,18 L 7,24 L 0,24 Z" fill="#fcfcfc" /><path d="M 24,2 L 13,2 A 11,11 0 0,1 2,13 L 2,24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" /><path d="M 24,7 L 18,7 A 11,11 0 0,1 7,18 L 7,24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" /></svg>
                                <svg width="100%" height="24" class="text-black block"><rect x="0" y="0" width="100%" height="7" fill="#fcfcfc" /><line x1="0" y1="2" x2="100%" y2="2" stroke="currentColor" stroke-width="2" /><line x1="0" y1="7" x2="100%" y2="7" stroke="currentColor" stroke-width="2" /></svg>
                                <svg viewBox="0 0 24 24" class="w-full h-full text-black block"><path d="M 24,0 L 0,0 L 0,7 L 6,7 A 11,11 0 0,0 17,18 L 17,24 L 24,24 Z" fill="#fcfcfc" /><path d="M 0,2 L 11,2 A 11,11 0 0,0 22,13 L 22,24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" /><path d="M 0,7 L 6,7 A 11,11 0 0,0 17,18 L 17,24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" /></svg>
                                <svg width="24" height="100%" class="text-black block"><rect x="0" y="0" width="7" height="100%" fill="#fcfcfc" /><line x1="2" y1="0" x2="2" y2="100%" stroke="currentColor" stroke-width="2" /><line x1="7" y1="0" x2="7" y2="100%" stroke="currentColor" stroke-width="2" /></svg>
                                <div></div>
                                <svg width="24" height="100%" class="text-black block"><rect x="17" y="0" width="7" height="100%" fill="#fcfcfc" /><line x1="22" y1="0" x2="22" y2="100%" stroke="currentColor" stroke-width="2" /><line x1="17" y1="0" x2="17" y2="100%" stroke="currentColor" stroke-width="2" /></svg>
                                <svg viewBox="0 0 24 24" class="w-full h-full text-black block"><path d="M 0,24 L 24,24 L 24,17 L 18,17 A 11,11 0 0,0 7,6 L 7,0 L 0,0 Z" fill="#fcfcfc" /><path d="M 24,22 L 13,22 A 11,11 0 0,0 2,11 L 2,0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" /><path d="M 24,17 L 18,17 A 11,11 0 0,0 7,6 L 7,0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" /></svg>
                                <svg width="100%" height="24" class="text-black block"><rect x="0" y="17" width="100%" height="7" fill="#fcfcfc" /><line x1="0" y1="22" x2="100%" y2="22" stroke="currentColor" stroke-width="2" /><line x1="0" y1="17" x2="100%" y2="17" stroke="currentColor" stroke-width="2" /></svg>
                                <svg viewBox="0 0 24 24" class="w-full h-full text-black block"><path d="M 24,24 L 0,24 L 0,17 L 6,17 A 11,11 0 0,1 17,6 L 17,0 L 24,0 Z" fill="#fcfcfc" /><path d="M 0,22 L 11,22 A 11,11 0 0,1 22,11 L 22,0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" /><path d="M 0,17 L 6,17 A 11,11 0 0,1 17,6 L 17,0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" /></svg>
                            </div>
                        </div>
                    </div>

                    <div id="card-price-container" class="w-full pb-3 sm:pb-4 bg-[#fcfcfc] text-center text-black flex-shrink-0 flex items-center justify-center z-10 relative">
                        <p id="card-price-preview" class="text-2xl sm:text-3xl font-bold monopoly-font tracking-wide">200€</p>
                    </div>
                </div>
            </div>

            <!-- CONTENEDOR DORSO -->
            <div id="monopoly-card-back" class="bg-white w-full max-w-[380px] aspect-[2.5/3.5] flex flex-col relative card-shadow select-none p-4 sm:p-5 shrink-0">
                <div id="card-back-border" class="border-[2px] border-black w-full h-full flex flex-col justify-center items-center relative overflow-hidden p-6 text-center transition-colors duration-300">
                    
                    <!-- LADO A: Diseño especial Policía Local -->
                    <div id="card-back-police-container" class="hidden flex-col justify-center items-center w-full h-full">
                        <h2 class="monopoly-font font-bold text-4xl sm:text-5xl uppercase tracking-[0.1em] text-black mb-1">VÁYASE</h2>
                        <h2 class="monopoly-font font-bold text-4xl sm:text-5xl uppercase tracking-[0.1em] text-black mb-2">A</h2>
                        <!-- Utiliza la imagen que subiste -->
                        <img src="policia_monopoly.png" alt="Policía" class="w-full max-w-[150px] object-cover mb-3 rounded-xl">
                        <h2 class="monopoly-font font-bold text-4xl sm:text-5xl uppercase tracking-[0.1em] text-black">LA CÁRCEL</h2>
                    </div>

                    <!-- LADO B: Diseño Normal y Estación (Bus) -->
                    <div id="card-back-normal-container" class="flex flex-col justify-center items-center w-full h-full">
                        
                        <!-- Título superior (Solo para Parada de Bus) -->
                        <h2 id="card-back-station-title" class="hidden monopoly-font font-bold text-3xl sm:text-4xl uppercase tracking-[0.1em] text-black mb-4">PARADA DE BUS</h2>
                        
                        <!-- Logo Moros Tuareg (Solo para calles normales) -->
                        <img id="card-back-logo-top" src="Logo_tuareg.png" alt="Moros Tuareg Logo" class="w-3/4 object-contain mb-6">
                        
                        <!-- Icono Bus lateral (Solo para Parada de Bus) -->
                        <svg id="card-back-bus-icon" class="hidden w-full max-w-[200px] h-auto mb-6 text-black" viewBox="0 0 120 50" fill="currentColor">
                            <!-- Carrocería -->
                            <path d="M 5,20 L 5,35 A 5,5 0 0,0 10,40 L 15,40 A 6,6 0 0,1 27,40 L 93,40 A 6,6 0 0,1 105,40 L 110,40 A 5,5 0 0,0 115,35 L 115,20 L 110,10 A 5,5 0 0,0 105,5 L 15,5 A 5,5 0 0,0 10,10 L 5,20 Z" />
                            <!-- Ventanas -->
                            <rect x="12" y="10" width="13" height="12" fill="#fff" rx="2" />
                            <rect x="28" y="10" width="13" height="12" fill="#fff" rx="2" />
                            <rect x="44" y="10" width="13" height="12" fill="#fff" rx="2" />
                            <rect x="60" y="10" width="13" height="12" fill="#fff" rx="2" />
                            <rect x="76" y="10" width="13" height="12" fill="#fff" rx="2" />
                            <rect x="92" y="10" width="13" height="12" fill="#fff" rx="2" />
                            <!-- Ruedas -->
                            <circle cx="21" cy="40" r="7" fill="#000" />
                            <circle cx="99" cy="40" r="7" fill="#000" />
                            <circle cx="21" cy="40" r="2.5" fill="#fff" />
                            <circle cx="99" cy="40" r="2.5" fill="#fff" />
                        </svg>

                        <!-- Logo Monopoly -->
                        <img id="card-back-logo" src="Logo_monopoly.png" alt="Monopoly Logo" class="w-full object-contain mb-4">
                        
                        <!-- Texto Pueblo RAFAL -->
                        <h2 id="card-back-text" class="monopoly-font font-bold text-5xl sm:text-6xl uppercase tracking-[0.15em] text-[#ed1b24] transition-colors duration-300">RAFAL</h2>
                    </div>

                </div>
            </div>

        </section>
    </main>

</body>
</html>
